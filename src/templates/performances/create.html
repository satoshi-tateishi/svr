{% extends "base.html" %}

{% block title %}公演を追加 | svr{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">公演を追加</h1>

  {% if error %}
    <div class="mb-4 px-4 py-3 rounded bg-red-100 text-red-700 border border-red-300">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="bg-white rounded-lg shadow p-6 space-y-4">
    {% csrf_token %}

    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">公演タイトル <span class="text-red-500">*</span></label>
      <input type="text" id="title" name="title" required
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
             placeholder="例：第10回公演「夜の帳」">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">開始日 <span class="text-red-500">*</span></label>
        <input type="date" id="start_date" name="start_date" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">終了日 <span class="text-red-500">*</span></label>
        <input type="date" id="end_date" name="end_date" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">備考</label>
      <textarea id="description" name="description" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                placeholder="会場・注意事項など（任意）"></textarea>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <a href="{% url 'performances:list' %}"
         class="px-4 py-2 rounded border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">
        キャンセル
      </a>
      <button type="submit"
              class="px-6 py-2 rounded bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
        作成
      </button>
    </div>
  </form>
</div>
{% endblock %}
