{# テンプレート展開セクション #}
<div class="bg-indigo-50 border border-indigo-200 rounded-lg p-6 mb-6">
  <h2 class="font-semibold text-indigo-800 mb-2">工程テンプレートを展開する</h2>
  <p class="text-sm text-indigo-700 mb-6">
    標準 10 工程（機材作り〜最終荷降ろし）を一括生成します。各工程の日程と開始時間を入力してください。
  </p>
  <form method="post" action="{% url 'performances:apply_template' performance.pk %}">
    {% csrf_token %}
    <div class="space-y-4 max-w-3xl">
      {% for step in template_steps %}
      <div class="flex items-center gap-4">
        <div class="w-40 shrink-0">
          <span class="text-sm font-medium text-indigo-900">{{ step }}</span>
        </div>
        <div class="flex items-center gap-3">
          {# 日付エリア: 固定幅を確保して時間の位置を揃える #}
          <div class="flex items-center gap-2 w-[340px]">
            <input type="date" name="phase_start_date_{{ forloop.counter0 }}"
                   class="border border-indigo-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 w-[150px]">
            
            {% if not forloop.last %}
              <span class="text-gray-400">~</span>
              <input type="date" name="phase_end_date_{{ forloop.counter0 }}"
                     class="border border-indigo-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 w-[150px]">
            {% else %}
              {# 最終工程用のスペーサー (150px + ~の分の幅) #}
              <div class="w-[174px]"></div>
            {% endif %}
          </div>

          {# 時間エリア #}
          <div class="flex items-center bg-white border border-indigo-300 rounded focus-within:ring-2 focus-within:ring-indigo-400">
            <input type="time" name="phase_start_time_{{ forloop.counter0 }}" value="12:00"
                   class="px-2 py-1.5 text-sm focus:outline-none border-none">
            <span class="text-gray-400 px-1">~</span>
            <input type="time" name="phase_end_time_{{ forloop.counter0 }}" value="21:00"
                   class="px-2 py-1.5 text-sm focus:outline-none border-none">
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="mt-8">
      <button type="submit"
              class="px-8 py-3 bg-indigo-600 text-white font-medium rounded hover:bg-indigo-700 shadow-sm">
        全工程を一括保存して展開
      </button>
    </div>
  </form>
</div>
