{# 車輌手配モーダル #}
<div id="vehicleModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeVehicleModal()"></div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full sm:p-6">
      <form action="{% url 'performances:vehicle_operation_add' performance.pk %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="date" id="v_modal_date_val">
        
        <div class="mb-5 border-b pb-4 flex justify-between items-center">
          <div>
            <h3 class="text-lg leading-6 font-bold text-gray-900" id="modal-title">車輌手配申請</h3>
            <p class="text-sm text-gray-500 mt-1">
              日程: <span id="v_modal_date_display" class="font-bold text-indigo-600"></span>
            </p>
          </div>
          <button type="button" onclick="closeVehicleModal()" class="text-gray-400 hover:text-gray-500">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <div class="space-y-6">
          {# 車種選択 #}
          <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
            <label class="block text-sm font-bold text-indigo-900 mb-2">車種の選択</label>
            <div class="flex items-center gap-4">
              <select name="vehicle_id" required class="block w-64 border border-indigo-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white">
                {% for vehicle in vehicles %}
                  <option value="{{ vehicle.pk }}">{{ vehicle.name }}({{ vehicle.get_vehicle_type_display }})</option>
                {% endfor %}
              </select>
              <p class="text-xs text-indigo-600">※ この車輌で行う一連の行程を以下に入力してください</p>
            </div>
          </div>

          {# 車両工程リスト #}
          <div>
            <div class="flex items-center justify-between mb-3">
              <label class="block text-sm font-bold text-gray-700">車両工程（タイムスケジュール）</label>
              <button type="button" onclick="addVehicleProcessRow()" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center gap-1 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200">
                <i class="fa-solid fa-circle-plus"></i> 工程を追加
              </button>
            </div>
            <div id="vehicle-process-list" class="space-y-3">
              {# ここに動的に工程が追加される #}
            </div>
          </div>
        </div>

        <div id="v_modal_history" class="mt-4 p-3 bg-gray-50 rounded text-[11px] text-gray-500 hidden border border-gray-100">
          <i class="fa-solid fa-circle-info mr-1"></i> <span id="v_modal_history_text"></span>
        </div>

        <div class="mt-8 pt-6 border-t flex justify-between items-center">
          <div>
            {# 削除ボタン (既存編集時のみ JS で表示) #}
            <button type="button" id="v_modal_delete_btn" 
                    class="bg-red-50 text-red-600 py-2 px-6 border border-red-200 rounded-md shadow-sm text-sm font-bold hover:bg-red-100 hidden">
              この手配を削除
            </button>
          </div>
          <div class="flex gap-3">
            <button type="button" onclick="closeVehicleModal()" class="bg-white py-2 px-6 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">
              キャンセル
            </button>
            {# 修正ボタン (閲覧モード時のみ表示) #}
            <button type="button" id="v_modal_edit_btn" onclick="enableVehicleEditMode()" 
                    class="bg-indigo-50 text-indigo-600 py-2 px-8 border border-indigo-200 rounded-md shadow-sm text-sm font-bold hover:bg-indigo-100 hidden">
              修正する
            </button>
            <button type="submit" id="v_modal_submit_btn" class="bg-indigo-600 py-2 px-10 border border-transparent rounded-md shadow-sm text-sm font-bold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              この内容で申請する
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
