{% extends "base.html" %}

{% block title %}公演を追加 | svr{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">公演を追加</h1>

  {% if error %}
    <div class="mb-4 px-4 py-3 rounded bg-red-100 text-red-700 border border-red-300">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="bg-white rounded-lg shadow p-6 space-y-6">
    {% csrf_token %}

    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">公演名 <span class="text-red-500">*</span></label>
      <input type="text" id="title" name="title" required
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
             placeholder="例：ハムレット">
    </div>

    <!-- 担当者セクション -->

    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-2">
        <label class="block text-sm font-medium text-gray-700">担当者</label>
        <button type="button" onclick="addStaffRow()"
                class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded border border-indigo-200 hover:bg-indigo-100">
          + 担当者を追加
        </button>
      </div>
      
      <div id="staff-container" class="space-y-2">
        <!-- JSで追加される担当者行 -->
      </div>
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">備考</label>
      <textarea id="description" name="description" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                placeholder="備考（任意）"></textarea>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <a href="{% url 'performances:dashboard' %}"
         class="px-4 py-2 rounded border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">
        キャンセル
      </a>
      <button type="submit"
              class="px-6 py-2 rounded bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
        作成
      </button>
    </div>
  </form>
</div>

<!-- 担当者行のテンプレート -->
<template id="staff-row-template">
  <div class="flex gap-2 items-center staff-row">
    <div class="flex-1">
      <select name="user_ids[]" required
              class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400">
        <option value="">氏名を選択...</option>
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.profile.full_name|default:user.username }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex-1">
      <select name="position_ids[]" required
              class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400">
        <option value="">ポジションを選択...</option>
        {% for pos in positions %}
          <option value="{{ pos.id }}">{{ pos.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="button" onclick="removeStaffRow(this)"
            class="p-1 text-gray-400 hover:text-red-500">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</template>

<script>
  function addStaffRow() {
    const container = document.getElementById('staff-container');
    const template = document.getElementById('staff-row-template');
    const clone = template.content.cloneNode(true);
    container.appendChild(clone);
  }

  function removeStaffRow(button) {
    button.closest('.staff-row').remove();
  }

  // 初期状態で1行追加
  window.onload = function() {
    addStaffRow();
  }
</script>
{% endblock %}
