{# 工程編集モーダル #}
<div id="editModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeEditModal()"></div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
      <form id="editForm" method="post" action="">
        {% csrf_token %}
        <div>
          <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title">工程の編集</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">工程名</label>
              <input type="text" name="name" id="modal_name" readonly
                     class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none sm:text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">開始日</label>
                <input type="date" name="suggested_start_date" id="modal_start_date" readonly
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none sm:text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">終了日</label>
                <input type="date" name="suggested_end_date" id="modal_end_date"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">開始時間</label>
                <input type="time" name="suggested_start_time" id="modal_start_time"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">終了時間</label>
                <input type="time" name="suggested_end_time" id="modal_end_time"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">希望人数 (プランナーとチーフ含まず)</label>
              <div class="mt-1 flex items-center gap-2">
                <input type="number" name="requested_staff_count" id="modal_staff_count" min="0"
                       class="block w-24 border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <span class="text-sm text-gray-600">名</span>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">備考</label>
              <textarea name="description" id="modal_description" rows="3"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        placeholder="工程に関する補足事項など"></textarea>
            </div>
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" onclick="closeEditModal()"
                  class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            キャンセル
          </button>
          <button type="submit"
                  class="bg-indigo-600 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
