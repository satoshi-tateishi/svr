<script>
  function openEditModal(id, name, startDate, endDate, startTime, endTime, staffCount, clickedDay, description) {
    const modal = document.getElementById('editModal');
    const form = document.getElementById('editForm');
    form.action = `/performances/phases/${id}/update/`;
    document.getElementById('modal_name').value = name;
    
    // クリックした行の日付を初期値としてセットする
    document.getElementById('modal_start_date').value = clickedDay;
    
    if (endDate && endDate >= clickedDay) {
        document.getElementById('modal_end_date').value = endDate;
    } else {
        document.getElementById('modal_end_date').value = clickedDay;
    }
    
    document.getElementById('modal_start_time').value = startTime || '12:00';
    document.getElementById('modal_end_time').value = endTime || '21:00';
    document.getElementById('modal_staff_count').value = staffCount;
    document.getElementById('modal_description').value = description || '';
    
    modal.classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
  }

  // --- 車輌モーダル制御 ---
  let currentOperationId = null;

  function openVehicleModal(day) {
    currentOperationId = null;
    const [y, m, d] = day.split('-').map(Number);
    const dateJp = `${y}年${m}月${d}日`;
    
    document.getElementById('v_modal_date_display').innerText = dateJp;
    document.getElementById('v_modal_date_val').value = day;
    document.getElementById('v_modal_delete_btn').classList.add('hidden');
    document.getElementById('v_modal_history').classList.add('hidden');
    document.getElementById('v_modal_edit_btn').classList.add('hidden');
    
    // ラベルリセット
    const submitBtn = document.getElementById('v_modal_submit_btn');
    if (submitBtn) {
        submitBtn.innerText = 'この内容で申請する';
        submitBtn.classList.remove('hidden');
    }
    
    // 車種選択を有効化
    const select = document.querySelector('select[name="vehicle_id"]');
    if (select) {
        select.disabled = false;
        select.classList.remove('bg-gray-100', 'cursor-not-allowed');
    }

    const addBtn = document.querySelector('#vehicleModal button[onclick="addVehicleProcessRow()"]');
    if (addBtn) addBtn.classList.remove('hidden');

    const list = document.getElementById('vehicle-process-list');
    list.innerHTML = '';
    addVehicleProcessRow('', '', '09:00');
    addVehicleProcessRow('', '', '10:00');
    
    document.getElementById('vehicleModal').classList.remove('hidden');
  }

  function openVehicleGroupEditModal(vehicleId, day) {
    const [y, m, d] = day.split('-').map(Number);
    const dateJp = `${y}年${m}月${d}日`;
    
    document.getElementById('v_modal_date_display').innerText = dateJp;
    document.getElementById('v_modal_date_val').value = day;
    
    // 車種をセットして無効化
    const select = document.querySelector('select[name="vehicle_id"]');
    if (vehicleId && select) {
        select.value = vehicleId;
        select.disabled = true;
        select.classList.add('bg-gray-100', 'cursor-not-allowed');
    }
    
    // ボタンの表示切り替え（閲覧モード）
    document.getElementById('v_modal_edit_btn').classList.remove('hidden');
    document.getElementById('v_modal_submit_btn').classList.add('hidden');
    document.getElementById('v_modal_delete_btn').classList.add('hidden');
    document.getElementById('v_modal_history').classList.add('hidden');

    // JSON データの読み取り
    const dataEl = document.getElementById(`ops-data-${day}-${vehicleId}`);
    if (!dataEl) return;
    let ops = JSON.parse(dataEl.textContent);

    // 有効な工程のIDリストを作成
    const activeOpIds = ops.filter(op => op.is_active).map(op => op.id);
    const deleteBtn = document.getElementById('v_modal_delete_btn');
    if (deleteBtn && activeOpIds.length > 0) {
        deleteBtn.setAttribute('onclick', `deleteVehicleOperation('${activeOpIds.join(',')}', '{{ performance.pk }}')`);
    }

    // ソート: 1. is_active(有効優先), 2. time(昇順)
    ops.sort((a, b) => {
        if (a.is_active !== b.is_active) {
            return a.is_active ? -1 : 1;
        }
        return a.time.localeCompare(b.time);
    });

    const list = document.getElementById('vehicle-process-list');
    list.innerHTML = '';
    
    ops.forEach(op => {
      addVehicleProcessRow(op.title, op.place, op.time, op.id, op.is_active, op.deleted_at, op.deleted_by, op.staff_count, op.updated_at, op.updated_by);
    });
    
    // 全入力を無効化（閲覧モード）
    const inputs = list.querySelectorAll('input, select, button[title="削除"]');
    inputs.forEach(el => {
        el.disabled = true;
        if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.classList.add('bg-gray-100', 'cursor-not-allowed');
        }
        if (el.tagName === 'BUTTON') {
            el.classList.add('hidden');
        }
    });
    const addBtn = document.querySelector('#vehicleModal button[onclick="addVehicleProcessRow()"]');
    if (addBtn) addBtn.classList.add('hidden');

    document.getElementById('vehicleModal').classList.remove('hidden');
  }

  function enableVehicleEditMode() {
    document.getElementById('v_modal_edit_btn').classList.add('hidden');
    const submitBtn = document.getElementById('v_modal_submit_btn');
    if (submitBtn) {
        submitBtn.innerText = 'この内容に修正する';
        submitBtn.classList.remove('hidden');
    }
    document.getElementById('v_modal_delete_btn').classList.remove('hidden');

    const select = document.querySelector('select[name="vehicle_id"]');
    if (select) {
        select.disabled = false;
        select.classList.remove('bg-gray-100', 'cursor-not-allowed');
    }

    const list = document.getElementById('vehicle-process-list');
    const inputs = list.querySelectorAll('input, select, button[title="削除"]');
    inputs.forEach(el => {
        const row = el.closest('.rounded-lg');
        if (row && !row.classList.contains('bg-red-50')) {
            el.disabled = false;
            if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
                el.classList.remove('bg-gray-100', 'cursor-not-allowed');
            }
            if (el.tagName === 'BUTTON') {
                el.classList.remove('hidden');
            }
        }
    });
    
    const addBtn = document.querySelector('#vehicleModal button[onclick="addVehicleProcessRow()"]');
    if (addBtn) addBtn.classList.remove('hidden');
  }

  function deleteVehicleOperation(opId, performanceId = null) {
    if (!opId) return;
    
    // 文字列化して判定
    const opIdStr = String(opId);
    const isBatch = opIdStr.includes(',');
    
    const confirmMsg = (isBatch || (performanceId && performanceId !== 'null'))
        ? 'この車輌手配（一連の工程すべて）を削除（無効化）しますか？\n削除履歴はシステムに保存されます。'
        : 'この工程を削除（無効化）しますか？\n削除履歴はシステムに保存されます。';

    if (confirm(confirmMsg)) {
      const form = document.createElement('form');
      form.method = 'POST';
      
      // performanceId が有効なら一括削除エンドポイントを使用
      if (performanceId && performanceId !== 'null') {
          form.action = `/performances/${performanceId}/vehicles/batch-delete/`;
          const idsInput = document.createElement('input');
          idsInput.type = 'hidden';
          idsInput.name = 'op_ids';
          idsInput.value = opIdStr;
          form.appendChild(idsInput);
      } else {
          // performanceId がない場合は単一削除。
          // 万が一 opId にカンマが含まれている場合は、最初の一つを使用するなどの安全策をとる
          const singleId = isBatch ? opIdStr.split(',')[0] : opIdStr;
          form.action = `/performances/vehicles/${singleId}/delete/`;
      }
      
      const csrf = document.createElement('input');
      csrf.type = 'hidden';
      csrf.name = 'csrfmiddlewaretoken';
      csrf.value = '{{ csrf_token }}';
      form.appendChild(csrf);
      document.body.appendChild(form);
      form.submit();
    }
  }

  function closeVehicleModal() {
    document.getElementById('vehicleModal').classList.add('hidden');
  }

  function updateVehicleProcessIndices() {
    const list = document.getElementById('vehicle-process-list');
    if (!list) return;
    let activeIdx = 1;
    Array.from(list.children).forEach((row) => {
      const indexSpan = row.querySelector('.process-index');
      if (indexSpan) {
          if (row.classList.contains('bg-red-50')) {
              indexSpan.innerText = '削除済';
              indexSpan.className = 'process-index text-[10px] font-bold text-white bg-gray-400 px-2 py-1 rounded w-14 text-center shrink-0';
          } else {
              indexSpan.innerText = `工程${activeIdx++}`;
              indexSpan.className = 'process-index text-xs font-bold text-white bg-indigo-500 px-2 py-1 rounded w-14 text-center shrink-0';
          }
      }
    });
  }

  function addVehicleProcessRow(name = '', place = '', time = '', opId = null, isActive = true, deletedAt = '', deletedBy = '', staffCount = 0, updatedAt = '', updatedBy = '') {
    const list = document.getElementById('vehicle-process-list');
    if (!list) return;
    
    if (!time && list.children.length > 0) {
        const lastTimeInput = list.lastElementChild.querySelector('input[type="time"]');
        if (lastTimeInput && lastTimeInput.value) {
            const [h, m] = lastTimeInput.value.split(':').map(Number);
            time = `${String((h + 1) % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
    }

    const row = document.createElement('div');
    if (!isActive) {
      row.className = 'p-2 bg-red-50 border border-red-100 rounded text-[11px] text-red-700 flex items-center justify-between opacity-70';
      row.innerHTML = `
        <div class="flex items-center gap-2 truncate">
          <span class="font-bold bg-red-200 px-1.5 py-0.5 rounded text-[10px] shrink-0">削除済み</span>
          <span class="font-medium whitespace-nowrap">${deletedAt} (${deletedBy})</span>
          <span class="text-red-300">|</span>
          <span class="truncate">${name || '(内容なし)'}</span>
          <span class="text-red-300">|</span>
          <span class="truncate">${place || '(場所なし)'}</span>
          <span class="text-red-300">|</span>
          <span>${time}</span>
          <span class="text-red-300">|</span>
          <span>${staffCount}名</span>
        </div>
      `;
      list.appendChild(row);
      updateVehicleProcessIndices();
      return;
    }

    row.className = 'flex items-start gap-3 p-4 rounded-lg border relative group transition-colors bg-gray-50 border-gray-200 hover:border-indigo-300';
    row.innerHTML = `
      <input type="hidden" name="op_id[]" value="${opId || ''}">
      <div class="flex-1 space-y-4">
        <div class="flex items-center gap-4">
          <span class="process-index text-xs font-bold text-white bg-indigo-500 px-2 py-1 rounded w-14 text-center shrink-0"></span>
          <div class="flex-[2]">
            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">内容</label>
            <input type="text" name="process_name[]" value="${name}" placeholder="荷積み、移動、劇場着など"
                   class="block w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div class="flex-[3]">
            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">場所</label>
            <input type="text" name="place[]" value="${place}" placeholder="倉庫名、稽古場、劇場名など"
                   class="block w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
        </div>
        <div class="flex items-center gap-8 ml-18 pl-1">
          <div class="flex items-center gap-3">
            <label class="text-[11px] font-bold text-gray-600 whitespace-nowrap">到着希望時刻:</label>
            <input type="time" name="time[]" value="${time || '09:00'}"
                   class="block border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="flex items-center gap-3">
            <label class="text-[11px] font-bold text-gray-600 whitespace-nowrap">助手人数:</label>
            <div class="flex items-center gap-1">
              <input type="number" name="staff_count[]" value="${staffCount}" min="0"
                     class="block w-16 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <span class="text-[11px] text-gray-400">名</span>
            </div>
          </div>
        </div>
        ${updatedAt ? `
        <div class="flex items-center gap-2 mt-2 px-3 py-1 bg-indigo-50/50 rounded-full border border-indigo-100/50 w-fit">
          <span class="text-[9px] font-bold text-indigo-400 uppercase tracking-tighter">最終修正</span>
          <span class="text-[10px] text-indigo-600 font-medium">${updatedAt} (${updatedBy})</span>
        </div>
        ` : ''}
      </div>
      <button type="button" onclick="${opId ? `deleteVehicleOperation('${opId}', '{{ performance.pk }}')` : `if(confirm('この工程の入力を削除しますか？')) { this.parentElement.remove(); updateVehicleProcessIndices(); }`}" 
              class="text-gray-300 hover:text-red-500 mt-1 transition-colors p-1" title="削除">
        <i class="fa-solid fa-trash-can text-lg"></i>
      </button>
    `;
    list.appendChild(row);
    updateVehicleProcessIndices();
  }

  document.addEventListener('DOMContentLoaded', function() {
    const el = document.getElementById('phase-header-row');
    if (el) {
      Sortable.create(el, {
        animation: 150,
        filter: '.no-drag',
        onEnd: function() {
          const phaseIds = Array.from(el.querySelectorAll('th[data-id]')).map(th => th.dataset.id);
          fetch('{% url "performances:phase_reorder" performance.pk %}', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ phase_ids: phaseIds })
          }).then(response => {
            if (response.ok) {
              window.location.reload();
            } else {
              alert('並び替えの保存に失敗しました。');
            }
          });
        }
      });
    }
  });
</script>
