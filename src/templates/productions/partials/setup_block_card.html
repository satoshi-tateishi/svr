<div class="rounded-2xl shadow-sm border overflow-hidden transition-all {% if is_aux %}bg-gray-50/50 border-gray-100 opacity-60 has-[:checked]:opacity-100 has-[:checked]:bg-white has-[:checked]:border-green-200{% else %}bg-white border-gray-100 has-[:checked]:border-indigo-200{% endif %}">
  
  <!-- ヘッダー -->
  <label class="px-5 py-4 flex items-center justify-between cursor-pointer active:bg-gray-50 select-none">
    <div class="flex items-center gap-3">
      <input type="checkbox" name="enabled_{{ block.key }}" id="id_{{ block.key }}" 
             {% if block.default_enabled %}checked{% endif %}
             class="w-6 h-6 rounded-lg text-indigo-600 focus:ring-indigo-500 border-gray-300">
      <span class="font-bold text-gray-900">{{ block.label }}</span>
    </div>
    
    <div class="flex items-center gap-2">
      {% if block.mode == 'date_range_same_task' or block.mode == 'performance_range' %}
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600">期間生成</span>
      {% elif block.mode == 'manual_subtasks' %}
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-200 text-gray-500">ブロックのみ</span>
      {% else %}
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-400">単日</span>
      {% endif %}
    </div>
  </label>

  <!-- 設定詳細（チェック時のみ表示するなどの制御をしてもよいが、まずはシンプルに） -->
  <div class="px-5 pb-5 pt-1 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-tighter mb-1">
          {% if block.mode == 'single_day' %}実施日{% else %}開始日{% endif %}
        </label>
        <input type="date" name="start_{{ block.key }}" 
               value="{{ production.start_date|date:'Y-m-d' }}"
               class="block w-full rounded-lg border-gray-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 py-2">
      </div>
      
      {% if block.mode != 'single_day' and block.mode != 'manual_subtasks' %}
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-tighter mb-1">終了日</label>
          <input type="date" name="end_{{ block.key }}" 
                 value="{{ production.end_date|date:'Y-m-d' }}"
                 class="block w-full rounded-lg border-gray-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 py-2">
        </div>
      {% endif %}
    </div>

    <div>
      <label class="block text-[10px] font-black text-gray-400 uppercase tracking-tighter mb-1">場所</label>
      <input type="text" name="location_{{ block.key }}" placeholder="場所を入力" 
             class="block w-full rounded-lg border-gray-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 py-2">
    </div>

    <input type="hidden" name="title_{{ block.key }}" value="{{ block.label }}">
  </div>
</div>
