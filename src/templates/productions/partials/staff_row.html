{% comment %}
人員申請行パーシャル
変数: slug, label, existing (StaffRequest | None)
{% endcomment %}
<div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
  <span class="flex-none w-20 text-xs font-bold text-gray-600">{{ label }}</span>
  <div class="flex items-center gap-2 flex-1">
    <input type="number"
           name="{{ slug }}_quantity"
           value="{{ existing.quantity|default:'' }}"
           min="1" max="20"
           class="form-input w-16 rounded-xl border-gray-200 text-sm text-center focus:ring-indigo-500 py-2"
           placeholder="—">
    <span class="text-xs text-gray-400">人</span>
  </div>
  <label class="flex items-center gap-1.5 cursor-pointer flex-none">
    <input type="checkbox"
           name="{{ slug }}_include_self"
           value="1"
           {% if existing.include_self %}checked{% endif %}
           class="w-3.5 h-3.5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
    <span class="text-[10px] font-bold text-gray-500 whitespace-nowrap">本人含む</span>
  </label>
</div>
