{% extends "base.html" %}

{% block title %}新規公演の作成 - svr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="mb-6 flex items-center gap-4">
    <a href="{% url 'productions:list' %}" class="flex-none w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 text-gray-400">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    <h1 class="text-xl font-bold text-gray-900">新規公演の作成</h1>
  </div>

  <form method="post" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">
    {% csrf_token %}
    
    <div>
      <label class="block text-xs font-bold text-gray-500 uppercase mb-1">公演タイトル</label>
      <input type="text" name="title" value="{{ form.title.value|default:'' }}" class="form-input block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500" placeholder="公演名を入力">
      {% if form.title.errors %}
        <p class="mt-1 text-xs text-red-600">{{ form.title.errors.0 }}</p>
      {% endif %}
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">開始日</label>
        <input type="date" name="start_date" value="{{ form.start_date.value|date:'Y-m-d'|default:'' }}" class="form-input block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">終了日</label>
        <input type="date" name="end_date" value="{{ form.end_date.value|date:'Y-m-d'|default:'' }}" class="form-input block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-gray-500 uppercase mb-1">備考</label>
      <textarea name="note" rows="3" class="form-textarea block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500" placeholder="備考があれば入力してください">{{ form.note.value|default:'' }}</textarea>
    </div>

    <!-- 担当者（任意） -->
    <div class="border-t border-gray-100 pt-5">
      <p class="text-xs font-bold text-gray-500 uppercase mb-3">
        担当者 <span class="text-red-500">*</span>
        <span class="text-gray-400 font-normal normal-case">どちらか1人以上必須</span>
      </p>
      {% if member_error %}
        <p class="mb-2 text-xs text-red-600 flex items-center gap-1">
          <i class="fa-solid fa-circle-exclamation"></i> {{ member_error }}
        </p>
      {% endif %}
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">サウンドデザイナー</label>
          <select name="sound_designer_id"
                  class="form-select block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">--- 未選択 ---</option>
            {% for u in users %}
              <option value="{{ u.pk }}" {% if u.pk|stringformat:"s" == selected_sound_designer_id %}selected{% endif %}>
                {% if u.profile %}{{ u.profile.full_name }}{% else %}{{ u.username }}{% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">チーフ</label>
          <select name="chief_id"
                  class="form-select block w-full rounded-lg border-gray-200 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">--- 未選択 ---</option>
            {% for u in users %}
              <option value="{{ u.pk }}" {% if u.pk|stringformat:"s" == selected_chief_id %}selected{% endif %}>
                {% if u.profile %}{{ u.profile.full_name }}{% else %}{{ u.username }}{% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="pt-4">
      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all">
        公演を保存する
      </button>
    </div>
  </form>
</div>
{% endblock %}
