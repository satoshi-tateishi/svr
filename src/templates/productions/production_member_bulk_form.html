<div id="modal-container"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm"
     x-data="{
         rows: [{ user_id: '', role: '', start_date: '', end_date: '', note: '' }],
         removeRow(index) {
             if (this.rows.length > 1) {
                 this.rows.splice(index, 1);
             }
         },
         prepareSubmit() {
             // user_id を文字列 → 数値変換（空文字はそのまま送る。view 側でスキップ）
             this.rows = this.rows.map(r => ({
                 ...r,
                 user_id: r.user_id ? String(r.user_id) : '',
             }));
         }
     }"
     onclick="if(event.target === this) this.remove()">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md sm:max-w-2xl flex flex-col max-h-[90vh]"
       onclick="event.stopPropagation()">

    <!-- ヘッダー -->
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-none">
      <h3 class="font-bold text-gray-900 text-base">担当者を追加</h3>
      <button type="button"
              onclick="document.getElementById('modal-container').remove()"
              class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- エラー -->
    {% if error_message %}
      <div class="px-6 pt-4 flex-none">
        <div class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ error_message }}
        </div>
      </div>
    {% endif %}

    <!-- フォーム -->
    <form hx-post="{% url 'productions:member_add' production.pk %}"
          hx-target="#modal-container"
          hx-swap="outerHTML"
          @submit="prepareSubmit()"
          class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="members_json" :value="JSON.stringify(rows)">

      <!-- 行リスト -->
      <template x-for="(row, index) in rows" :key="index">
        <div class="bg-gray-50 rounded-2xl border border-gray-100 overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-100 bg-white/80 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="w-7 h-7 rounded-full bg-indigo-50 border-2 border-indigo-200 text-indigo-600 flex items-center justify-center text-xs font-black flex-none"
                    x-text="index + 1"></span>
              <p class="text-xs font-semibold text-gray-700 truncate">担当者・役割・期間を入力</p>
            </div>
            <button type="button"
                    @click="removeRow(index)"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold text-red-500 hover:text-red-600 hover:bg-red-50 transition-colors"
                    :class="rows.length === 1 ? 'opacity-40 cursor-not-allowed pointer-events-none' : ''"
                    title="この行を削除">
              <i class="fa-solid fa-trash text-xs"></i> 削除
            </button>
          </div>

          <div class="p-4 space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">役割 <span class="text-red-500">*</span></label>
              <select x-model="row.role"
                      class="form-select block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
                <option value="">--- 選択 ---</option>
                {% for role_value, role_label in roles %}
                  <option value="{{ role_value }}">{{ role_label }}</option>
                {% endfor %}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">担当者 <span class="text-red-500">*</span></label>
              <select x-model="row.user_id"
                      class="form-select block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
                <option value="">--- 選択 ---</option>
                {% for u in users %}
                  <option value="{{ u.pk }}">{% if u.profile %}{{ u.profile.full_name }}{% else %}{{ u.username }}{% endif %}</option>
                {% endfor %}
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">開始日</label>
                <input type="date"
                       x-model="row.start_date"
                       class="form-input block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">終了日</label>
                <input type="date"
                       x-model="row.end_date"
                       class="form-input block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">備考</label>
              <input type="text"
                     x-model="row.note"
                     placeholder="備考（任意）"
                     class="form-input block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
            </div>
          </div>
        </div>
      </template>

      <!-- フッター -->
      <div class="pt-2 flex gap-3">
        <button type="button"
                onclick="document.getElementById('modal-container').remove()"
                class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition-colors">
          キャンセル
        </button>
        <button type="submit"
                class="flex-2 flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold hover:bg-indigo-700 transition-colors shadow-md shadow-indigo-200">
          <i class="fa-solid fa-check mr-1"></i> 追加
        </button>
      </div>
    </form>

  </div>
</div>
